# Override for zero-downtime prod deploy (staging slot on 5001)
version: '3.8'
services:
  frontend:
    container_name: watchcash_admin_prod_staging
    ports:
      - "5001:4000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
