name: Build Push and Deploy Dev

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_API_BASE_URL="https://api.watchncash.com" \
            --build-arg NEXT_PUBLIC_USE_PROXY=true \
            --build-arg NEXT_PUBLIC_APP_NAME="WatchCash Admin" \
            --pull \
            -t ${{ secrets.DOCKER_USER }}/watchcashfront_repo:prodlatest .

      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USER }}/watchcashfront_repo:prodlatest

      - name: EC2 Blue-Green Deploy
        run: |
          echo "${{ secrets.EC2_PRODSSH_KEY }}" > key.pem
          chmod 600 key.pem

          IMAGE=${{ secrets.DOCKER_USER }}/watchcashfront_repo:prodlatest
          ENV_PATH="/home/${{ secrets.EC2_PRODUSERNAME }}/Watchcash-admin/.env"

          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_PRODUSERNAME }}@${{ secrets.EC2_PRODHOST }} << EOF
            set -xe

            ############################################
            # Detect Active Container
            ############################################
            if docker ps --format '{{.Names}}' | grep -q watchcash_admin_blue; then
              ACTIVE=blue
              NEW=green
              NEW_PORT=9000
              OLD_PORT=9001
            else
              ACTIVE=green
              NEW=blue
              NEW_PORT=9001
              OLD_PORT=9000
            fi

            echo "Active container: \$ACTIVE"
            echo "Deploying to: \$NEW"

            ############################################
            # Pull Latest Image
            ############################################
            docker pull $IMAGE

            ############################################
            # Start New Container
            ############################################
            docker stop watchcash_admin_\$NEW || true
            docker rm watchcash_admin_\$NEW || true

            docker run -d \
              --name watchcash_admin_\$NEW \
              --env-file $ENV_PATH \
              -p \$NEW_PORT:3000 \
              --restart always \
              $IMAGE

            echo "Waiting for app to boot..."
            
            for i in {1..10}; do
              if curl -f http://localhost:\$NEW_PORT > /dev/null 2>&1; then
                break
              fi
              echo "Waiting for app..."
              sleep 5
            done

            ############################################
            # Health Check
            ############################################
            if curl -f http://localhost:\$NEW_PORT > /dev/null 2>&1; then
              echo "Health check passed ✅"
            else
              echo "Health check failed ❌ Rolling back"
              docker stop watchcash_admin_\$NEW
              docker rm watchcash_admin_\$NEW
              exit 1
            fi

            ############################################
            # Switch Traffic (Dynamic Blue/Green)
            ############################################

            if [ "\$NEW" = "blue" ]; then
                echo "Switching to BLUE ... Reloading nginx"

                if [ -f /etc/nginx/conf.d/watchcash-front.conf ]; then
                    sudo mv /etc/nginx/conf.d/watchcash-front.conf /etc/nginx/conf.d/watchcash-front.conf.disabled
                fi

                if [ -f /etc/nginx/conf.d/watchcash-blue.conf.disabled ]; then
                    sudo mv /etc/nginx/conf.d/watchcash-blue.conf.disabled /etc/nginx/conf.d/watchcash-blue.conf
                fi

            else
                echo "Switching to GREEN"

                if [ -f /etc/nginx/conf.d/watchcash-blue.conf ]; then
                    sudo mv /etc/nginx/conf.d/watchcash-blue.conf /etc/nginx/conf.d/watchcash-blue.conf.disabled
                fi

                if [ -f /etc/nginx/conf.d/watchcash-front.conf.disabled ]; then
                    sudo mv /etc/nginx/conf.d/watchcash-front.conf.disabled /etc/nginx/conf.d/watchcash-front.conf
                fi
            fi

            if sudo nginx -t; then
              sudo systemctl reload nginx
              echo "Traffic switched to $NEW ✅"
            else
              echo "Nginx config failed ❌ Rolling back"

              # Rollback nginx change
              if [ "\$ACTIVE" = "blue" ]; then
                  echo "Switching to BLUE ... in failed case ... Reloading nginx"

                  if [ -f /etc/nginx/conf.d/watchcash-front.conf ]; then
                      sudo mv /etc/nginx/conf.d/watchcash-front.conf /etc/nginx/conf.d/watchcash-front.conf.disabled
                  fi

                  if [ -f /etc/nginx/conf.d/watchcash-blue.conf.disabled ]; then
                      sudo mv /etc/nginx/conf.d/watchcash-blue.conf.disabled /etc/nginx/conf.d/watchcash-blue.conf
                  fi

              else
                  echo "Switching to GREEN in failed case ... Reloading nginx"

                  if [ -f /etc/nginx/conf.d/watchcash-blue.conf ]; then
                      sudo mv /etc/nginx/conf.d/watchcash-blue.conf /etc/nginx/conf.d/watchcash-blue.conf.disabled
                  fi

                  if [ -f /etc/nginx/conf.d/watchcash-front.conf.disabled ]; then
                      sudo mv /etc/nginx/conf.d/watchcash-front.conf.disabled /etc/nginx/conf.d/watchcash-front.conf
                  fi
              fi

              sudo nginx -t && sudo systemctl reload nginx

              docker stop watchcash_admin_$NEW
              docker rm watchcash_admin_$NEW

              exit 1
            fi

            ############################################
            # Stop Old Container
            ############################################
            docker stop watchcash_admin_\$ACTIVE || true
            docker rm watchcash_admin_\$ACTIVE || true

            ############################################
            # SAFE IMAGE CLEANUP
            ############################################
            echo "Cleaning unused images safely..."

            # Remove dangling images
            docker image prune -f

            # Remove unused images not used by any container
            docker images --format "{{.Repository}}:{{.Tag}} {{.ID}}" | grep watchcashfront_repo | while read repo id; do
              if ! docker ps -a --format "{{.Image}}" | grep -q \$repo; then
                echo "Removing unused image: \$repo"
                docker rmi \$repo || true
              fi
            done

            echo "Deployment successful 🎉"

          EOF