name: Build Push and Deploy Prod

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build --pull -t ${{ secrets.DOCKER_USER }}/watchcashfront_repo:prodlatest .

      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USER }}/watchcashfront_repo:prodlatest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE="${{ secrets.DOCKER_USER }}/watchcashfront_repo:prodlatest"

            echo "Pulling latest image..."
            docker pull $IMAGE

            echo "Stopping old container...."
            docker stop watchcash_admin_prod || true
            docker rm watchcash_admin_prod || true

            echo "Running new container..."
            docker run -d \
              --name watchcash_admin_prod \
              -p 9000:3000 \
              --restart always \
              $IMAGE

            echo "Cleaning unused images..."
            docker image prune -af || true

            echo "Deployment completed successfully!"