name: Build Push and Deploy Dev

on:
  push:
    branches:
      - development
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build --pull -t ${{ secrets.DOCKER_USER }}/watchcashfront_repo:devlatest .

      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USER }}/watchcashfront_repo:devlatest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE=${{ secrets.DOCKER_USER }}/watchcashfront_repo:devlatest

            echo "Pulling latest image...."
            docker pull $IMAGE

            echo "Stopping existing container..."
            docker compose -f docker-compose.yml down || true

            echo "Starting updated container..."
            docker compose -f docker-compose.yml up -d

            echo "Cleaning unused images..."
            docker image prune -af || true

            echo "Deployment completed successfully!"