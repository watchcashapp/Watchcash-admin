name: Build Push and Deploy Dev

on:
  push:
    branches:
      - development
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_API_BASE_URL="https://dev-api.watchncash.com/api" \
            --build-arg NEXT_PUBLIC_USE_PROXY=true \
            --build-arg NEXT_PUBLIC_APP_NAME="WatchCash Admin" \
            --pull \
            -t ${{ secrets.DOCKER_USER }}/watchcashfront_repo:devlatest .

      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USER }}/watchcashfront_repo:devlatest

      - name: EC2 Blue-Green Deploy
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem

          IMAGE=${{ secrets.DOCKER_USER }}/watchcashfront_repo:devlatest
          ENV_PATH="/home/${{ secrets.EC2_USERNAME }}/Watchcash-admin/.env"

          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -xe

            ############################################
            # Detect Active Container
            ############################################
            if docker ps --format '{{.Names}}' | grep -q watchcash_admin_blue; then
              ACTIVE=blue
              NEW=green
              NEW_PORT=9000
              OLD_PORT=9001
            else
              ACTIVE=green
              NEW=blue
              NEW_PORT=9001
              OLD_PORT=9000
            fi

            echo "Active container: $ACTIVE"
            echo "Deploying to: $NEW (Port: $NEW_PORT)"

            ############################################
            # Pull Latest Image
            ############################################
            IMAGE="${{ secrets.DOCKER_USER }}/watchcashfront_repo:devlatest"
            docker pull $IMAGE

            ############################################
            # Start New Container
            ############################################
            docker stop watchcash_admin_$NEW || true
            docker rm watchcash_admin_$NEW || true

            docker run -d \
              --name watchcash_admin_$NEW \
              --env-file /home/${{ secrets.EC2_USERNAME }}/Watchcash-admin/.env \
              -p $NEW_PORT:3000 \
              --restart always \
              $IMAGE

            echo "Waiting for app to boot on port $NEW_PORT..."
            
            # Wait loop with curl
            READY=false
            for i in {1..20}; do
              if curl -f http://localhost:$NEW_PORT > /dev/null 2>&1; then
                echo "App is responding! ✅"
                READY=true
                break
              fi
              echo "Waiting for app... ($i/20)"
              sleep 3
            done

            if [ "$READY" = "false" ]; then
              echo "Health check failed ❌ App didn't start in time. Rolling back."
              docker stop watchcash_admin_$NEW || true
              docker rm watchcash_admin_$NEW || true
              exit 1
            fi

            # Short grace period for internal initialization
            sleep 2

            ############################################
            # Switch Traffic (Dynamic Blue/Green)
            ############################################
            switch_traffic() {
                local target=$1
                echo "Switching traffic to $target..."
                
                if [ "$target" = "blue" ]; then
                    [ -f /etc/nginx/conf.d/watchcash-front.conf ] && sudo mv /etc/nginx/conf.d/watchcash-front.conf /etc/nginx/conf.d/watchcash-front.conf.disabled
                    [ -f /etc/nginx/conf.d/watchcash-blue.conf.disabled ] && sudo mv /etc/nginx/conf.d/watchcash-blue.conf.disabled /etc/nginx/conf.d/watchcash-blue.conf
                else
                    [ -f /etc/nginx/conf.d/watchcash-blue.conf ] && sudo mv /etc/nginx/conf.d/watchcash-blue.conf /etc/nginx/conf.d/watchcash-blue.conf.disabled
                    [ -f /etc/nginx/conf.d/watchcash-front.conf.disabled ] && sudo mv /etc/nginx/conf.d/watchcash-front.conf.disabled /etc/nginx/conf.d/watchcash-front.conf
                fi
                
                if ! sudo nginx -t; then
                    return 1
                fi
                sudo systemctl reload nginx
                return 0
            }

            if ! switch_traffic "$NEW"; then
              echo "Nginx config failed ❌ Rolling back traffic to $ACTIVE"
              switch_traffic "$ACTIVE" || echo "Critical: Rollback traffic switch failed!"
              docker stop watchcash_admin_$NEW || true
              docker rm watchcash_admin_$NEW || true
              exit 1
            fi

            echo "Traffic successfully switched to $NEW ✅"

            ############################################
            # Stop Old Container
            ############################################
            echo "Stopping old container $ACTIVE..."
            docker stop watchcash_admin_$ACTIVE || true
            docker rm watchcash_admin_$ACTIVE || true

            ############################################
            # SAFE IMAGE CLEANUP
            ############################################
            echo "Cleaning unused images safely..."
            docker image prune -f
            docker images --format "{{.Repository}}:{{.Tag}}" | grep watchcashfront_repo | while read img; do
              if [ "$img" != "watchcashfront_repo:devlatest" ] && ! docker ps -a --format "{{.Image}}" | grep -q "$img"; then
                echo "Removing unused image: $img"
                docker rmi $img || true
              fi
            done

            echo "Deployment successful 🎉"
          EOF
